<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 – Link Not Found | SnapLink</title>
  <link rel="stylesheet" href="/static/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <main class="card" style="text-align:center;gap:1.4rem">
    <div style="font-size:5rem;line-height:1">🔗</div>
    <h1 style="font-size:2rem;font-weight:700;color:#1e1b4b;margin:0">404 – Link Not Found</h1>
    <p style="color:#6b7280;margin:0">
      The short code <code style="background:#f3f4f6;padding:2px 8px;border-radius:6px;font-weight:600">{{ short_code }}</code>
      doesn't exist or has been removed.
    </p>
    <a href="/" class="btn-primary" style="text-decoration:none;display:inline-flex;align-items:center;gap:.5rem;width:fit-content;margin:0 auto">
      ← Go back &amp; create a new link
    </a>
  </main>

  <script src="/static/script.js"></script>
</body>
</html>
