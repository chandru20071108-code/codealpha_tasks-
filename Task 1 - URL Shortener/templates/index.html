<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SnapLink – URL Shortener</title>
  <link rel="stylesheet" href="/static/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- ───── Background Blobs ───── -->
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <!-- ───── Main Card ───── -->
  <main class="card">

    <!-- Header -->
    <div class="card-header">
      <div class="logo">
        <svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="36" height="36" rx="10" fill="url(#grad)"/>
          <path d="M10 18 Q18 8 26 18 Q18 28 10 18Z" fill="white" opacity="0.9"/>
          <circle cx="18" cy="18" r="4" fill="white"/>
          <defs>
            <linearGradient id="grad" x1="0" y1="0" x2="36" y2="36" gradientUnits="userSpaceOnUse">
              <stop stop-color="#6C63FF"/>
              <stop offset="1" stop-color="#48D1CC"/>
            </linearGradient>
          </defs>
        </svg>
        <span>SnapLink</span>
      </div>
      <p class="subtitle">Paste a long URL and get a clean, shareable short link in seconds.</p>
    </div>

    <!-- Input Form -->
    <div class="form-group">
      <div class="input-wrapper">
        <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
          <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
        </svg>
        <input
          id="urlInput"
          type="url"
          placeholder="https://your-very-long-url.com/goes/here"
          autocomplete="off"
          spellcheck="false"
        />
      </div>
      <button id="shortenBtn" class="btn-primary">
        <span class="btn-text">Shorten URL</span>
        <span class="btn-spinner" hidden>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
          </svg>
        </span>
      </button>
    </div>

    <!-- Message Area -->
    <div id="message" class="message" hidden></div>

    <!-- Result Card -->
    <div id="resultCard" class="result-card" hidden>
      <div class="result-label">🎉 Your shortened URL is ready!</div>
      <div class="result-url-row">
        <a id="shortUrlLink" href="#" target="_blank" rel="noopener noreferrer" class="short-url-text"></a>
        <button id="copyBtn" class="btn-copy" title="Copy to clipboard">
          <svg id="copyIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
          <span id="copyLabel">Copy</span>
        </button>
      </div>
      <div class="result-original">
        <span class="result-original-label">Original:</span>
        <span id="originalUrlText" class="result-original-url"></span>
      </div>
    </div>

    <!-- Footer -->
    <p class="footer-note">Built with Flask &amp; SQLite · CodeAlpha Internship</p>

  </main>

  <script src="/static/script.js"></script>
</body>
</html>
